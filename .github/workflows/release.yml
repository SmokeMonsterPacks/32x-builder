name: release

# Community-map pipeline, phase 2: every merge to main that changes the game's
# content (maps, engine, assets, registry) builds the ROM on the pinned marsdev
# toolchain and publishes a GitHub Release — tag build-<commit count>, same
# scheme as scripts/release.sh and the in-game CREDITS build number. A merged
# community-map PR becomes a playable ROM download with no maintainer steps.
#
# Also runnable by hand (workflow_dispatch) to re-cut a release for HEAD.
on:
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - 'sh_src/**'
      - 'md_src/**'
      - 'registry.json'
      - 'tools/gen_maps.py'
      - 'tools/gen_assets.py'
      - 'tools/mapfmt.py'
  workflow_dispatch:

permissions:
  contents: write   # create tags + releases, upload the ROM asset

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MARSDEV_VER: v1.0.0-rc1
      MARSDEV: ${{ github.workspace }}/.marsdev
      # itch.io publishing. Mapped at JOB level (not on the step) so the step's
      # own `if:` can read it — that's the only way to skip gracefully when the
      # secret isn't configured. Add the key with:
      #   gh secret set BUTLER_API_KEY   (from itch.io/user/settings/api-keys)
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: paisleyboxers/backrooms32x:32x
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # rev-list --count needs full history

      - name: Compute build tag
        id: tag
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=build-${BUILD}"        >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"            >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"                >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)"    >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "release ${{ steps.tag.outputs.tag }} already exists — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache marsdev toolchain
        if: steps.exists.outputs.skip != 'true'
        id: cache-marsdev
        uses: actions/cache@v4
        with:
          path: ${{ env.MARSDEV }}
          key: marsdev-${{ env.MARSDEV_VER }}-linux-x86_64

      - name: Install marsdev (prebuilt toolchain)
        if: steps.exists.outputs.skip != 'true' && steps.cache-marsdev.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/andwn/marsdev/releases/download/${MARSDEV_VER}/marsdev-${MARSDEV_VER}-linux-x86_64.tar.xz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar -xJ -C "$tmp"
          gcc="$(find "$tmp" -path '*/sh-elf/bin/sh-elf-gcc' | head -1)"
          test -n "$gcc" || { echo "::error::sh-elf-gcc not found in marsdev tarball"; exit 1; }
          root="$(dirname "$(dirname "$(dirname "$gcc")")")"
          mkdir -p "$MARSDEV"
          cp -a "$root"/. "$MARSDEV"/

      - name: Build ROM
        if: steps.exists.outputs.skip != 'true'
        run: make release MARSDEV="$MARSDEV"

      # The flagship above ships core + curated content only. These extra ROMs
      # carry what contributors have sent in:
      #   backrooms-community.32x   every community map + community asset
      #   backrooms-<handle>.32x    the flagship + ONE contributor's own maps,
      #                             so a first-time mapper gets a ROM with their
      #                             level in the real game
      # Both are skipped cleanly when maps/community/ is empty.
      - name: Build the community + per-author ROMs
        if: steps.exists.outputs.skip != 'true'
        id: sidebuilds
        run: |
          set -euo pipefail
          shopt -s nullglob
          MAPS=(maps/community/*.map)
          if [ ${#MAPS[@]} -eq 0 ]; then
            echo "no community maps — flagship only"
            echo "assets=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          make community MARSDEV="$MARSDEV"
          ASSETS="rom/backrooms-community.32x"
          # One ROM per DISTINCT author handle, as gen_maps resolves it (raw
          # author: folded through registry author_aliases, lowercased).
          HANDLES=$(python3 - <<'PY'
          import glob, json, sys
          sys.path.insert(0, "tools")
          import mapfmt
          alias = json.load(open("registry.json")).get("author_aliases", {})
          out = set()
          for p in glob.glob("maps/community/*.map"):
              raw = (mapfmt.parse(open(p).read()).get("author") or "").strip()
              who = alias.get(raw.lower(), raw).lower()
              if who and not who.startswith("_"):
                  out.add(who)
          print("\n".join(sorted(out)))
          PY
          )
          for h in $HANDLES; do
            echo "::group::author ROM: $h"
            make author AUTHOR="$h" MARSDEV="$MARSDEV"
            ASSETS="$ASSETS rom/backrooms-$h.32x"
            echo "::endgroup::"
          done
          echo "assets=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: Release notes (commits since the previous build tag)
        if: steps.exists.outputs.skip != 'true'
        id: notes
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'build-*' --sort=-creatordate | head -1 || true)
          RANGE=""; [ -n "$PREV" ] && RANGE="${PREV}..HEAD"
          NOTES=$(git log --no-merges --pretty='- %s (%h)' $RANGE)
          [ -n "$NOTES" ] || NOTES="- (no new commits since ${PREV})"
          # New community maps in this release get a shout-out up top.
          NEWMAPS=$(git diff --diff-filter=A --name-only ${PREV:+$PREV..HEAD} -- 'maps/community/*.map' | \
                    sed 's|maps/community/||; s|\.map$||; s/^/- 🗺️ NEW community map: /' || true)
          {
            echo 'notes<<NOTES_EOF'
            [ -n "$NEWMAPS" ] && { echo "$NEWMAPS"; echo; }
            echo "$NOTES"
            echo
            echo '---'
            echo '**Which ROM do I want?** `backrooms.32x` is the game — canon plus the'
            echo 'maps the project authors made or vetted. `backrooms-community.32x`'
            echo 'adds every map and asset contributors have sent in, vetted or not.'
            echo '`backrooms-<name>.32x` is the game plus that one contributor’s maps.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" rom/backrooms.32x \
            ${{ steps.sidebuilds.outputs.assets }} \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ steps.tag.outputs.build }} — ${{ steps.tag.outputs.date }} (${{ steps.tag.outputs.sha }})" \
            --notes "${{ steps.notes.outputs.notes }}"

      # Push the SAME artifact we just released, so the GitHub Release asset and
      # the itch.io download are byte-identical — no separate build, no drift.
      # itch's version is the build number, which is also what the ROM stamps
      # into its own CREDITS screen, so a player can always match what they're
      # running to what the page says. Skips silently until BUTLER_API_KEY is set.
      - name: Publish to itch.io
        if: steps.exists.outputs.skip != 'true' && env.BUTLER_API_KEY != ''
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -qq /tmp/butler.zip -d /tmp/butler-bin
          chmod +x /tmp/butler-bin/butler
          # --if-changed: don't burn a version when the bytes are identical.
          /tmp/butler-bin/butler push rom/backrooms.32x "$ITCH_TARGET" \
            --userversion "${{ steps.tag.outputs.build }}" --if-changed
          /tmp/butler-bin/butler status "${ITCH_TARGET%%:*}"
